name: Update GitHub Streak Card

on:
  schedule:
    # Runs every day at 00:30 UTC
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch contribution data and update SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: byanjanstarlord-arch
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import datetime
          import re

          username = os.environ["GITHUB_USERNAME"]
          token = os.environ["GH_TOKEN"]

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-streak-card"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.loads(response.read().decode("utf-8"))

          if "errors" in data:
              raise RuntimeError(
                  "GitHub API error: " + json.dumps(data["errors"])
              )

          calendar = (
              data["data"]["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total = calendar["totalContributions"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({
                      "date": datetime.date.fromisoformat(day["date"]),
                      "count": day["contributionCount"]
                  })

          days.sort(key=lambda x: x["date"])

          # --------------------------------------------------
          # CURRENT STREAK
          # --------------------------------------------------

          today = datetime.date.today()

          # GitHub's contribution calendar may contain today,
          # depending on when the workflow runs.
          valid_days = [
              d for d in days
              if d["date"] <= today
          ]

          current_streak = 0

          if valid_days:
              last = valid_days[-1]

              # If today has no contribution, check yesterday.
              if last["date"] == today and last["count"] == 0:
                  last_index = len(valid_days) - 2
              else:
                  last_index = len(valid_days) - 1

              if last_index >= 0:
                  expected_date = valid_days[last_index]["date"]

                  for i in range(last_index, -1, -1):
                      day = valid_days[i]

                      if day["date"] != expected_date:
                          break

                      if day["count"] <= 0:
                          break

                      current_streak += 1
                      expected_date -= datetime.timedelta(days=1)

          # --------------------------------------------------
          # LONGEST STREAK
          # --------------------------------------------------

          longest_streak = 0
          running_streak = 0
          previous_date = None

          for day in valid_days:

              if day["count"] > 0:

                  if (
                      previous_date is not None
                      and day["date"] == previous_date + datetime.timedelta(days=1)
                  ):
                      running_streak += 1
                  else:
                      running_streak = 1

                  longest_streak = max(
                      longest_streak,
                      running_streak
                  )

              else:
                  running_streak = 0

              previous_date = day["date"]

          print("Total contributions:", total)
          print("Current streak:", current_streak)
          print("Longest streak:", longest_streak)

          # --------------------------------------------------
          # UPDATE SVG
          # --------------------------------------------------

          svg_path = "byanjan_github_streak_card.svg"

          if not os.path.exists(svg_path):
              raise FileNotFoundError(
                  f"{svg_path} was not found in the repository."
              )

          with open(svg_path, "r", encoding="utf-8") as file:
              svg = file.read()

          def update_stat(svg, element_id, value):
              pattern = (
                  rf'(<text[^>]*id="{re.escape(element_id)}"'
                  rf'[^>]*>).*?(</text>)'
              )

              updated, count = re.subn(
                  pattern,
                  rf'\g<1>{value}\g<2>',
                  svg,
                  count=1,
                  flags=re.DOTALL
              )

              if count == 0:
                  raise RuntimeError(
                      f"Could not find SVG element: {element_id}"
                  )

              return updated

          svg = update_stat(
              svg,
              "total-contributions",
              total
          )

          svg = update_stat(
              svg,
              "current-streak",
              current_streak
          )

          svg = update_stat(
              svg,
              "longest-streak",
              longest_streak
          )

          with open(svg_path, "w", encoding="utf-8") as file:
              file.write(svg)

          print("SVG updated successfully.")
          PY

      - name: Commit updated streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add byanjan_github_streak_card.svg

          if git diff --cached --quiet; then
            echo "No streak changes detected."
          else
            git commit -m "chore: update GitHub streak card"
            git push
          fi
