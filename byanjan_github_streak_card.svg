<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
<metadata>
  <github-streak-card
    username="byanjanstarlord-arch"
    total="total-contributions"
    current="current-streak"
    longest="longest-streak"/>
</metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111111"/><stop offset="1" stop-color="#191919"/>
</linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
<path d="M28 0H0V28" fill="none" stroke="#F5C400" stroke-opacity=".055"/>
<circle cx="2" cy="2" r="1.2" fill="#F5C400" fill-opacity=".12"/>
</pattern>
<clipPath id="clip"><rect width="1000" height="340" rx="18"/></clipPath>
</defs>

<rect x="1" y="1" width="998" height="338" rx="18" fill="url(#bg)" stroke="#F5C400" stroke-width="2"/>
<g clip-path="url(#clip)">
<rect width="1000" height="340" fill="url(#grid)"/>
<rect width="1000" height="8" fill="#F5C400"/>

<path d="M42 62H260M740 62H958" stroke="#F5C400" stroke-width="1" opacity=".65"/>
<circle cx="42" cy="62" r="4" fill="#F5C400"/>
<circle cx="958" cy="62" r="4" fill="#F5C400"/>

<text x="500" y="48" text-anchor="middle" fill="#F5F4EA"
font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="4">
GITHUB / CONTRIBUTION LOG
</text>

<text x="500" y="96" text-anchor="middle" fill="#F5C400"
font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" letter-spacing="2">
⚡ CONTRIBUTION STREAK
</text>

<text x="500" y="123" text-anchor="middle" fill="#9C9C94"
font-family="Arial,Helvetica,sans-serif" font-size="13" font-style="italic">
Consistency compounds.
</text>

<line x1="333" y1="151" x2="333" y2="277" stroke="#3A3A3A"/>
<line x1="666" y1="151" x2="666" y2="277" stroke="#3A3A3A"/>

<text x="166" y="169" text-anchor="middle" fill="#8F8F87" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2">TOTAL</text>
<text id="total-contributions" data-stat="total-contributions" x="166" y="222" text-anchor="middle" fill="#F5C400" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900">831</text>
<text x="166" y="249" text-anchor="middle" fill="#F5F4EA" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1">CONTRIBUTIONS</text>

<text x="500" y="169" text-anchor="middle" fill="#8F8F87" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2">CURRENT</text>
<text id="current-streak" data-stat="current-streak" x="500" y="222" text-anchor="middle" fill="#F5C400" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900">1</text>
<text x="500" y="249" text-anchor="middle" fill="#F5F4EA" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1">DAY STREAK</text>

<text x="833" y="169" text-anchor="middle" fill="#8F8F87" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2">LONGEST</text>
<text id="longest-streak" data-stat="longest-streak" x="833" y="222" text-anchor="middle" fill="#F5C400" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="900">25</text>
<text x="833" y="249" text-anchor="middle" fill="#F5F4EA" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1">DAY STREAK</text>

<rect x="40" y="292" width="920" height="1" fill="#3A3A3A"/>
<text x="42" y="319" fill="#F5C400" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="2">BYANJAN BEHERA</text>
<text x="958" y="319" text-anchor="end" fill="#777770" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="2">GITHUB / BYANJANSTARLORD-ARCH</text>
</g>
